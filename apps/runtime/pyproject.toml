[tool.poetry]
name = "flowos-runtime"
version = "0.1.0"
description = "FlowOS LangGraph execution runtime"
authors = ["FlowOS"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.139.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<0.53"}
langgraph = "^1.2.0"
langchain-core = "^1.4.0"
langchain-anthropic = "^1.4.0"
langchain-openai = "^1.3.0"
supabase = "^2.31.0"
httpx = "^0.28.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.0"
apscheduler = "^3.10.0"
structlog = ">=24.4.0"
sentry-sdk = {version = ">=2.14.0", extras = ["fastapi"]}
opentelemetry-api = ">=1.27.0"
opentelemetry-sdk = ">=1.27.0"
opentelemetry-exporter-otlp = ">=1.27.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
